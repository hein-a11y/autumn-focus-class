<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>フロントライン・リインカーネーション ～最前線開拓日記～</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #0f111a;
        color: #e0e6ed;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
      }
      #game-container {
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(88, 101, 242, 0.15);
        border: 2px solid #2d3250;
        border-radius: 6px;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .instructions {
        margin-top: 10px;
        font-size: 13px;
        color: #8b9bb4;
        text-align: center;
      }
      .instructions span {
        display: inline-block;
        background: #1e2238;
        padding: 2px 6px;
        border-radius: 4px;
        margin: 0 3px;
        color: #ffcc00;
        font-weight: bold;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div class="instructions">
      移動: <span>W</span><span>A</span><span>S</span><span>D</span> / <span>方向キー</span> / <span>画面クリック長押し</span> |
      攻撃: <span>SPACE</span> / <span>J</span> |
      採取/調べる: <span>E</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
